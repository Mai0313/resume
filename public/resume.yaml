    References:
      - name: Jiayi Xu
        summary: >
          As Manager of MediaTek's Standard Cell Library Dept. II, I witnessed Wei Cheng Lee architect and deliver a custom terabyte-scale data analysis and visualization platform for IC design — replacing Splunk to overcome its scalability and customization limits, and enabling real-time analysis of SPICE models, sidefile models, and silicon measurement data. His command of scalable data pipelines and performance-critical algorithms, paired with deep engagement with IC design workflows, turned a long-standing tooling gap into a decision-making accelerator for the broader engineering organization.

      - name: Yi-Chen Lin
        summary: >
          As MediaTek's ML Team Manager, I observed Wei Cheng Lee translate his open-source credibility — built through contributions to AutoGen, LangChain, LangGraph, and MLflow — into tangible team outcomes. He directly engaged AutoGen's co-authors, Chi Wang (DeepMind) and Qingyun Wu (Penn State University), to fast-track fixes aligned with our needs and host technical exchanges at MediaTek. He also routinely took on the less visible, high-leverage work of hardening testing and data pipelines, raising productivity across the department.

      - name: Yu-Sheng Lin
        summary: >
          As project manager for MediaTek's AI Thermal Simulation initiative, I saw Wei Cheng Lee drive the core technical execution behind "Fast SoC Thermal Simulation with Physics-aware U-Net" (NeurIPS 2023) — integrating physics-aware thermal gradient constraints into the model architecture, validating data efficiency gains through rigorous experimentation, and delivering production-grade code the team could readily extend. He further broadened our research horizon by prototyping a Swin Transformer V2 variant for thermal image generation, showcasing both depth and strategic initiative.

# ---------------------------------------------------------------------------
# PDF design (rendercv only — ignored by the web UI).
# Reference: https://docs.rendercv.com/user_guide/yaml_input_structure/design
